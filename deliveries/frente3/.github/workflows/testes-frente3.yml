name: Testes - Frente 3 (banco + rateio)

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - "alembic.ini"
      - "requirements-frente3.txt"
      - ".github/workflows/testes-frente3.yml"
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evchargeops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evchargeops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-frente3.txt
      - name: Lint
        run: ruff check backend scripts
      - name: Testes (motor + integração com PostgreSQL)
        run: python -m pytest backend/tests -v
