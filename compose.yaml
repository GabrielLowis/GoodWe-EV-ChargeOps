name: ev-chargeops
services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcharge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/configure.py}
      POSTGRES_DB: ${POSTGRES_DB:-evchargeops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evcharge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evchargeops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evcharge}:${POSTGRES_PASSWORD}@db:5432/evchargeops_test
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
  simulator:
    build: .
    profiles: ["demo"]
    env_file: .env
    environment:
      API_URL: http://backend:8000/api
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python", "scripts/simulate.py"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
