# Configuração do Alembic (migrations do PostgreSQL).
# A URL do banco NÃO fica aqui: é lida de DATABASE_URL (ver backend/config.py).
#
# Uso, a partir da raiz do repositório:
#   alembic upgrade head      -> cria/atualiza o schema
#   alembic downgrade base    -> remove tudo (cuidado)

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
