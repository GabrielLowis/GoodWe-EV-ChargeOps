name: Integração
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: evcharge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evchargeops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evcharge -d evchargeops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://evcharge:ci-only-password@127.0.0.1:5432/evchargeops_test
      TEST_DATABASE_URL: postgresql+psycopg://evcharge:ci-only-password@127.0.0.1:5432/evchargeops_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m condocharge_ai.training.train
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m ruff check backend condocharge_ai scripts tests
      - run: python -m scripts.export_openapi
      - run: git diff --exit-code -- docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
